[package]
name = "blotter-desktop"
version = "0.1.0"
edition = "2021"
description = "Blotter desktop — local incident blotter, no network"
license = "Apache-2.0"

[lib]
name = "blotter_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "blotter-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
blotter = { path = ".." }
